<text x="412.50000000000006" y="165" text-anchor="middle" class="node">archive::restore</text>
<path d="M412.50000000000006 190 V960" stroke="#8ca3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="536.6666666666667" y="130" width="178.33333333333334" height="60" rx="7" fill="#edf7fb" stroke="#2b6d8a" stroke-width="2"/>
<text x="625.8333333333334" y="165" text-anchor="middle" class="node">open / decode</text>
<path d="M625.8333333333334 190 V960" stroke="#8ca3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="750.0" y="130" width="178.33333333333334" height="60" rx="7" fill="#edf7fb" stroke="#2b6d8a" stroke-width="2"/>
<text x="839.1666666666666" y="165" text-anchor="middle" class="node">临时内层归档</text>
<path d="M839.1666666666666 190 V960" stroke="#8ca3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="963.3333333333334" y="130" width="178.33333333333334" height="60" rx="7" fill="#edf7fb" stroke="#2b6d8a" stroke-width="2"/>
<text x="1052.5" y="165" text-anchor="middle" class="node">fs::restore</text>
<path d="M1052.5 190 V960" stroke="#8ca3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="1176.6666666666667" y="130" width="178.33333333333334" height="60" rx="7" fill="#edf7fb" stroke="#2b6d8a" stroke-width="2"/>
<text x="1265.8333333333335" y="165" text-anchor="middle" class="node">NTFS 目标</text>
<path d="M1265.8333333333335 190 V960" stroke="#8ca3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="35" y="1022" class="small">默认不覆盖；完整外层校验通过后才恢复用户文件；目录元数据在子对象处理后恢复。</text>
